<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6fdb">
  <title>3.14のかけざん</title>
  <script>
    // サブパス配信で末尾スラッシュなしで開かれたら補う(相対パス参照を正しく解決するため)
    (function () {
      var p = location.pathname;
      if (p.charAt(p.length - 1) !== '/' && p.split('/').pop().indexOf('.') === -1) {
        location.replace(p + '/' + location.search + location.hash);
      }
    })();
  </script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main id="app" aria-live="polite"></main>
  <noscript><p class="noscript">このアプリは JavaScript をつかいます。ブラウザの せっていを たしかめてね。</p></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
